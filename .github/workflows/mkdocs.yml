site_name: TestRepo Docs
site_description: "TestRepo — 模型与工具文档"
site_author: autoMBD
repo_name: autoMBD/TestRepo
repo_url: https://github.com/autoMBD/TestRepo
nav:
  - Home: index.md
  - Quick Start: getting-started.md
  - Tutorials:
      - Quick Tutorial: tutorials/tutorial-quick.md
      - Advanced: tutorials/tutorial-advanced.md
  - Examples: examples/index.md
  - Models:
      - MODEL_A: models/MODEL_A.md
  - API: api/index.md
  - Contributing: contributing.md
  - Changelog: changelog.md

theme:
  name: material
  palette:
    primary: 'indigo'
    accent: 'indigo'
  features:
    - navigation.instant
    - content.code.copy

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed
plugins:
  - search
  - git-revision-date-localized:
      enable: true
  - mkdocs-simple-hooks